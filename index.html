<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kviz iz Tipografije</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --accent-color: #3498db;
            --correct-color: #2ecc71;
            --incorrect-color: #e74c3c;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .quiz-container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            position: relative;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--bg-color);
        }

        .question-count {
            font-size: 0.95em;
            font-weight: 700;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .live-score {
            display: flex;
            gap: 15px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .score-item {
            padding: 4px 10px;
            border-radius: 6px;
        }

        .score-correct {
            background-color: #e8f8f0;
            color: var(--correct-color);
        }

        .score-wrong {
            background-color: #fdeaea;
            color: var(--incorrect-color);
        }

        .question-text {
            font-size: 1.25em;
            font-weight: 600;
            margin-bottom: 24px;
            color: #1a252f;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 18px;
            text-align: left;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.25s ease;
            outline: none;
            color: var(--text-color);
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--accent-color);
            background-color: #eaf4fc;
        }

        /* Instant Feedback Glowing Styles */
        .option-btn.correct-glow {
            background-color: #2ecc71 !important;
            border-color: #27ae60 !important;
            color: #ffffff !important;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
        }

        .option-btn.wrong-glow {
            background-color: #e74c3c !important;
            border-color: #c0392b !important;
            color: #ffffff !important;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.6);
        }

        .option-btn[disabled] {
            cursor: default;
            opacity: 0.85;
        }

        .footer-actions {
            display: flex;
            justify-content: flex-end;
            min-height: 48px;
        }

        .next-btn {
            display: none;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1em;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .next-btn:hover {
            background-color: #2980b9;
        }

        /* End Screen */
        .result-screen {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .result-screen h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .final-score {
            font-size: 3em;
            font-weight: 800;
            color: var(--accent-color);
            margin: 15px 0;
        }

        .stats-summary {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            font-size: 1.1em;
        }

        .restart-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        .restart-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="quiz-header">
            <span class="question-count" id="question-count">Pitanje 1 od 103</span>
            <div class="live-score">
                <span class="score-item score-correct">Točno: <strong id="correct-count">0</strong></span>
                <span class="score-item score-wrong">Netočno: <strong id="wrong-count">0</strong></span>
            </div>
        </div>

        <div class="question-text" id="question-text">Učitavanje...</div>

        <div class="options-grid" id="options-grid"></div>

        <div class="footer-actions">
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Sljedeće pitanje →</button>
        </div>
    </div>

    <div id="result-screen" class="result-screen">
        <h2>Kviz Završen!</h2>
        <p>Vaš konačni rezultat:</p>
        <div class="final-score" id="final-score">0 / 103</div>
        <div class="stats-summary">
            <span class="score-item score-correct">Točno: <strong id="final-correct">0</strong></span>
            <span class="score-item score-wrong">Netočno: <strong id="final-wrong">0</strong></span>
        </div>
        <p id="percentage-text" style="font-size: 1.2em; font-weight: 600; color: #555;"></p>
        <button class="restart-btn" onclick="restartQuiz()">Pokreni ponovno</button>
    </div>
</div>

let currentIndex = 0;
let correctCount = 0;
let wrongCount = 0;

function loadQuestion() {
    const currentQ = quizData[currentIndex];
    
    // Update header info
    document.getElementById('question-count').innerText = `Pitanje ${currentIndex + 1} od ${quizData.length}`;
    document.getElementById('question-text').innerText = currentQ.q;
    
    // Hide Next button until answer is clicked
    document.getElementById('next-btn').style.display = 'none';

    // Render options
    const optionsGrid = document.getElementById('options-grid');
    optionsGrid.innerHTML = '';

    currentQ.options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn';
        btn.innerText = optText;
        btn.onclick = () => selectAnswer(index);
        optionsGrid.appendChild(btn);
    });
}

function selectAnswer(selectedIndex) {
    const currentQ = quizData[currentIndex];
    const buttons = document.querySelectorAll('.option-btn');

    // Disable all options once clicked
    buttons.forEach((btn, index) => {
        btn.disabled = true;
        
        if (index === currentQ.answer) {
            // Correct answer glows green
            btn.classList.add('correct-glow');
        }
        
        if (index === selectedIndex && selectedIndex !== currentQ.answer) {
            // Selected wrong answer glows red
            btn.classList.add('wrong-glow');
        }
    });

    // Update Live Score Counter
    if (selectedIndex === currentQ.answer) {
        correctCount++;
        document.getElementById('correct-count').innerText = correctCount;
    } else {
        wrongCount++;
        document.getElementById('wrong-count').innerText = wrongCount;
    }

    // Reveal Next Button
    const nextBtn = document.getElementById('next-btn');
    if (currentIndex === quizData.length - 1) {
        nextBtn.innerText = 'Prikaži Rezultat';
    } else {
        nextBtn.innerText = 'Sljedeće pitanje →';
    }
    nextBtn.style.display = 'inline-block';
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';

    document.getElementById('final-score').innerText = `${correctCount} / ${quizData.length}`;
    document.getElementById('final-correct').innerText = correctCount;
    document.getElementById('final-wrong').innerText = wrongCount;

    const percentage = Math.round((correctCount / quizData.length) * 100);
    document.getElementById('percentage-text').innerText = `Točnost: ${percentage}%`;
}

function restartQuiz() {
    currentIndex = 0;
    correctCount = 0;
    wrongCount = 0;
    document.getElementById('correct-count').innerText = '0';
    document.getElementById('wrong-count').innerText = '0';
    
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    
    loadQuestion();
}

// Initialize quiz on load
document.addEventListener('DOMContentLoaded', loadQuestion);
</script>
